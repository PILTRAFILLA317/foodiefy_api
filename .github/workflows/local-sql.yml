name: Local ephemeral SQL (manual, no remote credentials)
'on': workflow_dispatch
permissions:
  contents: read
jobs:
  sql:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.14.0'
      - uses: supabase/setup-cli@d347ba47d3fb7eeeddbbc793bc8d4779caf773ea
        with:
          version: '2.110.0'
      - run: "python -m pip install --only-binary=:all: -r requirements-dev.lock"
      - run: "supabase start"
      - run: "supabase db push --local --yes"
      - run: "supabase test db --local"
      - run: "supabase db advisors --local --type all --fail-on warn"
      - run: "supabase db lint --local --level warning"
      - run: "python -m pytest -q tests/test_imports_postgres.py"
        env:
          FOODIEFY_LOCAL_IMPORT_TESTS: '1'
          IMPORT_ALLOW_PAID: 'false'
      - run: "python -m scripts.test_shopping_local --local"
      - if: always()
        run: "supabase stop"
