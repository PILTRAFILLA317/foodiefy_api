[project]
name = "python-api-railway"
env = "python"

[phases.setup]
nixPkgs = ["python312", "ffmpeg"]

[phases.install]
cmds = [
  "python3 -m venv /app/.venv",
  ". /app/.venv/bin/activate && pip install --no-cache-dir --upgrade pip",
  ". /app/.venv/bin/activate && pip install --no-cache-dir torch==2.4.1+cpu torchaudio==2.4.1 --extra-index-url https://download.pytorch.org/whl/cpu",
  ". /app/.venv/bin/activate && pip install --no-cache-dir -r requirements.txt"
]

[phases.build]
cmds = [". /app/.venv/bin/activate && python -m textblob.download_corpora lite"]

[start]
cmd = ". /app/.venv/bin/activate && uvicorn src.fastapi_app:app --host 0.0.0.0 --port 6001"

[variables]
PIP_NO_CACHE_DIR = "1"