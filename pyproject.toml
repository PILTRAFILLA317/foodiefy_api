[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
# Historical implementations remain reference code, outside the rescue runtime.
extend-exclude = ["src/legacy_fastapi.py", "src/flask_app.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
